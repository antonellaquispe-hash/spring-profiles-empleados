services:
  mysql:
    image: mysql:8.0
    container_name: empleados-mysql
    environment:
      MYSQL_ROOT_PASSWORD: laboratorio
    ports:
      - "3306:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plaboratorio"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mysql_data:
